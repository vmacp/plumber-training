name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  content: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@main
        with:
          node-version: 22

      - name: Changed files
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96

      - name: Install tooling
        run: curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh -o install.sh && sha256sum -c install.sha256 && bash install.sh

      - name: Build
        run: |
          echo "Build de l'application"
          node --version

      - name: Log PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "PR title = $TITLE"
